<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    .navbar {
        height: 70px;
        background: #0d0d0d;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 80px;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .brand img {
        width: 32px;
        height: auto;
    }

    .nav-links {
        list-style: none;
        display: flex;
        gap: 30px;
    }

    .nav-links li a {
        text-decoration: none;
        color: rgb(160, 161, 161);
        font-size: 16px;
        position: relative;
        padding-bottom: 5px;
        transition: color 0.3s ease;
    }

    .nav-links li a:hover {
        color: white;
    }

    .nav-links li a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 2px;
        background: white;
        transition: width 0.3s ease;
    }

    .nav-links li a:hover::after {
        width: 100%;
    }

    .login-link {
        color: white;
        padding-right: 20px;
        text-decoration: none;
    }

    .register-btn {
        background: #2ea293;
        color: white;
        padding: 8px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        display: inline-block;
    }

    .register-btn:hover {
        background: #279688;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }

    .form-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 40px;
        margin-top: 40px;
    }

    .form-card h1 {
        font-size: 32px;
        color: #2c3e50;
        margin-bottom: 30px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #2ea293;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .btn {
        background: #2ea293;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: inline-block;
        margin-right: 10px;
    }

    .btn:hover {
        background: #279688;
    }

    .btn-secondary {
        background: #6c757d;
    }

    .btn-secondary:hover {
        background: #5a6268;
    }

    @media (max-width: 768px) {
        .navbar {
            padding: 0 20px;
            flex-direction: column;
            height: auto;
            padding-bottom: 20px;
        }

        .nav-links {
            gap: 15px;
            margin-top: 20px;
        }

        .container {
            padding: 10px;
        }

        .form-card {
            padding: 20px;
        }
    }
</style>

<body>
    <div class="navbar">
        <div class="brand">
            <img src="assets/images/check(1) 1.svg" alt="logo-head">
            <span class="logo">Job Portal</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Jobs</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact-us.html">Contact Us</a></li>
        </ul>

        <div>
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <h1><i class="fas fa-user-edit"></i> Edit Company Profile</h1>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="company-name">Company Name</label>
                    <input type="text" id="company-name" name="company-name" placeholder="e.g. Tech Corp" value="Tech Corp" required>
                </div>

                <div class="form-group">
                    <label for="company-description">Company Description</label>
                    <textarea id="company-description" name="company-description" placeholder="Describe your company..." required>Technology Solutions Company</textarea>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g. San Francisco, CA" value="San Francisco, CA" required>
                </div>

                <div class="form-group">
                    <label for="industry">Industry</label>
                    <select id="industry" name="industry" required>
                        <option value="technology" selected>Technology</option>
                        <option value="finance">Finance</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="education">Education</option>
                        <option value="marketing">Marketing</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="url" id="website" name="website" placeholder="https://www.company.com">
                </div>

                <div class="form-group">
                    <label for="contact-email">Contact Email</label>
                    <input type="email" id="contact-email" name="contact-email" placeholder="hr@company.com" required>
                </div>

                <div class="form-group">
                    <label for="contact-phone">Contact Phone</label>
                    <input type="tel" id="contact-phone" name="contact-phone" placeholder="+1 (555) 123-4567">
                </div>

                <div class="form-group">
                    <label for="company-size">Company Size</label>
                    <select id="company-size" name="company-size">
                        <option value="">Select Company Size</option>
                        <option value="1-10">1-10 employees</option>
                        <option value="11-50">11-50 employees</option>
                        <option value="51-200">51-200 employees</option>
                        <option value="201-500">201-500 employees</option>
                        <option value="501-1000">501-1000 employees</option>
                        <option value="1000+">1000+ employees</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="founded-year">Founded Year</label>
                    <input type="number" id="founded-year" name="founded-year" placeholder="e.g. 2010" min="1800" max="2024">
                </div>

                <button type="submit" class="btn">Save Changes</button>
                <a href="company-dashboard.html" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
