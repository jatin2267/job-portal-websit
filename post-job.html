<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Job</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    .navbar {
        height: 70px;
        background: #0d0d0d;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 80px;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .brand img {
        width: 32px;
        height: auto;
    }

    .nav-links {
        list-style: none;
        display: flex;
        gap: 30px;
    }

    .nav-links li a {
        text-decoration: none;
        color: rgb(160, 161, 161);
        font-size: 16px;
        position: relative;
        padding-bottom: 5px;
        transition: color 0.3s ease;
    }

    .nav-links li a:hover {
        color: white;
    }

    .nav-links li a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 2px;
        background: white;
        transition: width 0.3s ease;
    }

    .nav-links li a:hover::after {
        width: 100%;
    }

    .login-link {
        color: white;
        padding-right: 20px;
        text-decoration: none;
    }

    .register-btn {
        background: #2ea293;
        color: white;
        padding: 8px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        display: inline-block;
    }

    .register-btn:hover {
        background: #279688;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }

    .form-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 40px;
        margin-top: 40px;
    }

    .form-card h1 {
        font-size: 32px;
        color: #2c3e50;
        margin-bottom: 30px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #2ea293;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .btn {
        background: #2ea293;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: inline-block;
        margin-right: 10px;
    }

    .btn:hover {
        background: #279688;
    }

    .btn-secondary {
        background: #6c757d;
    }

    .btn-secondary:hover {
        background: #5a6268;
    }

    @media (max-width: 768px) {
        .navbar {
            padding: 0 20px;
            flex-direction: column;
            height: auto;
            padding-bottom: 20px;
        }

        .nav-links {
            gap: 15px;
            margin-top: 20px;
        }

        .container {
            padding: 10px;
        }

        .form-card {
            padding: 20px;
        }
    }
</style>

<body>
    <div class="navbar">
        <div class="brand">
            <img src="assets/images/check(1) 1.svg" alt="logo-head">
            <span class="logo">Job Portal</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Jobs</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact-us.html">Contact Us</a></li>
        </ul>

        <div>
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <h1><i class="fas fa-plus-circle"></i> Post New Job</h1>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" name="job-title" placeholder="e.g. Software Engineer" required>
                </div>

                <div class="form-group">
                    <label for="job-description">Job Description</label>
                    <textarea id="job-description" name="job-description" placeholder="Describe the job responsibilities, requirements, and benefits..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g. New York, NY" required>
                </div>

                <div class="form-group">
                    <label for="salary">Salary Range</label>
                    <input type="text" id="salary" name="salary" placeholder="e.g. $50,000 - $70,000" required>
                </div>

                <div class="form-group">
                    <label for="job-type">Job Type</label>
                    <select id="job-type" name="job-type" required>
                        <option value="">Select Job Type</option>
                        <option value="full-time">Full Time</option>
                        <option value="part-time">Part Time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                        <option value="remote">Remote</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="experience-level">Experience Level</label>
                    <select id="experience-level" name="experience-level" required>
                        <option value="">Select Experience Level</option>
                        <option value="entry">Entry Level</option>
                        <option value="mid">Mid Level</option>
                        <option value="senior">Senior Level</option>
                        <option value="executive">Executive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="technology">Technology</option>
                        <option value="finance">Finance</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="education">Education</option>
                        <option value="marketing">Marketing</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="application-deadline">Application Deadline</label>
                    <input type="date" id="application-deadline" name="application-deadline">
                </div>

                <div class="form-group">
                    <label for="contact-email">Contact Email</label>
                    <input type="email" id="contact-email" name="contact-email" placeholder="e.g. hr@company.com" required>
                </div>

                <button type="submit" class="btn">Post Job</button>
                <a href="company-dashboard.html" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
